<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rankings | Kangaroo Cup</title>
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/favicon-32-v2.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon-v2.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap" style="padding-top:40px;">
<section>
<h2>Rankings by year</h2>
<p style="color:var(--muted); margin-top:-10px;">
Empty rows are placeholders. Results get added to
<code>js/data.js</code> as they come in.
</p>

<div class="year-tabs" id="year-tabs"></div>

<div class="edition-meta" id="edition-meta"></div>

<table class="rankings">
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Score</th>
<th>Notes</th>
</tr>
</thead>
<tbody id="rankings-body"></tbody>
</table>
</section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function renderResultsPage() {
  const tabsEl = document.getElementById("year-tabs");
  const metaEl = document.getElementById("edition-meta");
  const bodyEl = document.getElementById("rankings-body");
  const editions = KANGAROO_CUP.editions;

  let activeYear = editions[0].year;

  function draw() {
    tabsEl.innerHTML = editions
    .map(
      (ed) =>
      `<button data-year="${ed.year}" class="${ed.year === activeYear ? "active" : ""}">${ed.year}</button>`
      )
    .join("");

    const edition = editions.find((e) => e.year === activeYear);

    metaEl.innerHTML = `
    <span><strong>Dates:</strong> ${edition.dates || "TBD"}</span>
    <span><strong>Location:</strong> ${edition.host || "TBD"}</span>
    <span><strong>Champion:</strong> ${edition.champion || "TBD"}</span>
    `;

    bodyEl.innerHTML = edition.rankings
    .map((row) => {
      const rank = row.rank == null ? "-" : row.rank;
      const name = row.name
      ? row.name
      : '<span class="placeholder">TBD</span>';
      const score = row.score
      ? row.score
      : '<span class="placeholder">TBD</span>';
      const notes = row.notes || "";
      return `<tr><td class="rank">${rank}</td><td>${name}</td><td>${score}</td><td>${notes}</td></tr>`;
      })
    .join("");
    }

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-year]");
    if (!btn) return;
    activeYear = Number(btn.dataset.year);
    draw();
    });

  draw();
  }

document.addEventListener("DOMContentLoaded", renderResultsPage);
</script>
</body>
</html>
